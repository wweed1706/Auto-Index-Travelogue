name: travelogue-auth-test
services:
  mongodb:
    image: mongo:8.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB_NAME: auth_e2e
      JWT_SECRET: isolated-auth-test-secret-not-for-production
      CORS_ORIGINS: '["http://127.0.0.1:4183"]'
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 2s
      timeout: 5s
      retries: 30
